name: Templates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Generate, build and lint every template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # Prebuilt binaries. `cargo install` works too, but compiles both from
      # source on every run.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-generate,wasm-pack

      # A template's sources are not a valid Rust project: the manifests carry
      # `name = "{{...}}"`, which is not a legal package name until it has been
      # substituted. So each one is generated first and the generated project is
      # what gets built.
      #
      # Every directory holding a cargo-generate.toml is a template. Nothing
      # lists them, so adding one needs no change here.
      - name: Verify templates
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for manifest in */cargo-generate.toml; do
            template="$(dirname "$manifest")"
            found=1
            echo "::group::$template"
            out="$RUNNER_TEMP/$template"
            mkdir -p "$out"
            cargo generate --path "$template" \
              --name generated_project --force --silent --vcs none \
              --destination "$out"
            pushd "$out/generated_project" > /dev/null
            cargo build --workspace --all-targets
            cargo test --workspace
            cargo clippy --workspace --all-targets -- -D warnings
            cargo fmt --all --check

            # A crate declaring cdylib is a wasm crate. Building it for the
            # host, as the steps above just did, proves nothing about wasm, so
            # it is packaged for the real target too. No template lists itself
            # as a wasm one: the crate type is the fact, so it is the test.
            while IFS= read -r wasm_manifest; do
              crate_dir="$(dirname "$wasm_manifest")"
              echo "wasm-pack: $crate_dir"
              wasm-pack build "$crate_dir" --target web \
                --out-dir "$out/pkg-$(basename "$crate_dir")"
            done < <(grep -rl 'crate-type *= *\["cdylib"' \
              --include=Cargo.toml --exclude-dir=target . || true)

            popd > /dev/null
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "no templates found: expected at least one */cargo-generate.toml" >&2
            exit 1
          fi
